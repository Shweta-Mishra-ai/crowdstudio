services:
  - type: web
    name: crowdstudio-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 7d
      # Allow CORS from deployed frontends (e.g. Vercel) as well as local preview
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: crowdstudio-db
          property: connectionString
      - key: AI_EXPORT_PROVIDER
        sync: false
      - key: AI_EXPORT_API_KEY
        sync: false
      - key: AI_EXPORT_ENDPOINT
        sync: false

  - type: web
    name: crowdstudio-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set to the real deployed backend URL (e.g. https://crowdstudio-backend.onrender.com)
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: crowdstudio-db
    plan: free
    databaseName: crowdstudio
    user: crowdstudio
